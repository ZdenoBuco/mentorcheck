name: Version Bump

on:
  push:
    branches: [ main ]

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Bump patch version
        run: mvn versions:set -DnextSnapshot=true -DgenerateBackupPoms=false

      - name: Commit to new branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BRANCH_NAME=version-bump/${GITHUB_RUN_NUMBER}
          git checkout -b $BRANCH_NAME
          git commit -am "chore: bump version"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        id: create_pr
        run: |
          BRANCH_NAME=version-bump/${GITHUB_RUN_NUMBER}
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls \
            -d "{\"title\":\"Version bump\",\"head\":\"$BRANCH_NAME\",\"base\":\"main\",\"body\":\"Automated version bump\"}")
          echo "$PR_RESPONSE"
          # Extrahuje číslo PR
          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      - name: Rebase and merge PR
        run: |
          curl -X PUT \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ env.PR_NUMBER }}/merge \
            -d '{"merge_method":"rebase"}'

